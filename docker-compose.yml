services:
  frontend:
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    build:
      context: ./client # Assuming your frontend code is in a directory called "frontend"
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    volumes:
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./server # Assuming your backend code is in a directory called "backend"
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlite:/app/data/aegis.db # Update the database path
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ssl_certs:
  data:
