version: '3'
services:
  spring-boot-app:
    build: .
    ports:
      - "8443:8443"
    environment:
      SPRING_APPLICATION_JSON: |
        {
          "server": {
            "ssl": {
              "enabled": true,
              "key-store": "classpath:keystore.p12",
              "key-store-password": "AegisPassword",
              "key-alias": "aegis"
            }
          }
        }
    volumes:
      - db_data:/app/data/
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
