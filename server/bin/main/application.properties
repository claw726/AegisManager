# Database setup
spring.datasource.url=jdbc:sqlite:/app/data/aegis.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging
logging.level.root=INFO
logging.level.org.aegis.project=DEBUG
logging.level.org.hibernate.SQL=OFF

# Email setup
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=aegisprojectmanager@gmail.com
spring.mail.password=qvnn lcnm vadh pvic
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=WHEN_AUTHORIZED
management.endpoint.health.show-components=WHEN_AUTHORIZED
management.info.env.enabled=true

# Additional health configurations
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Configure health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.mail.enabled=true